<form id="form-id">
  <div class="pure-g">
    <div class="pure-u-1-3">
      <label for="name" class="col-form-label">Name</label>
    </div>
    <div class="pure-u-2-3">
      <input type="text" name="name" placeholder="Name" value="Sample name" class="form-control"></input>
    </div>
  </div>
  <div class="pure-g">
    <div class="pure-u-1-3">
      <label for="description" class="col-form-label">Description</label>
    </div>
    <div class="pure-u-2-3">
      <textarea rows="10" name="description" wrap="on" spellcheck="false" class="form-control">Sample description</textarea>
    </div>
  </div>
</form>
